# =============================================================================
# IWM — nginx site config
# =============================================================================
#
# Install as /etc/nginx/conf.d/iwm.conf on the EC2 instance.
#
# Both names are listed so certbot can cover them with one certificate.
#
# This file is the HTTP-only version. Once certbot runs it rewrites this block
# in place, adds the TLS listeners and the redirect from :80. Do not hand-edit
# the certbot-added lines afterwards — re-run certbot instead.
# =============================================================================

server {
    listen 80;
    listen [::]:80;

    server_name foodloss.ca www.foodloss.ca;

    root /var/www/iwm;
    index index.html;

    # ------------------------------------------------------------------
    # SPA routing. THIS LINE IS NOT OPTIONAL.
    #
    # React Router owns /login, /dashboard, /reports and the rest on the
    # client. nginx knows nothing about them — there is no /dashboard
    # directory on disk. Without this, loading the app at the root works and
    # every deep link or refresh returns 404: sign in, land on /dashboard,
    # press F5, get a 404. Serving index.html for anything that is not a real
    # file hands the URL to the router, which is what resolves it.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # Hashed assets are immutable: index.html references
    # assets/index-ZAkx7Mkm.js, and a new build produces a new hash. So they
    # can be cached hard and forever.
    # ------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # index.html must NEVER be cached. It is the file that names which hashed
    # bundle to load, so a stale copy pins browsers to a deployment you have
    # already replaced — users keep running old code and no amount of
    # refreshing fixes it.
    # ------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
    }

    # Text assets compress to roughly a third of their size; the JS bundle is
    # ~2 MB raw and ~500 kB gzipped, which is the difference between a slow
    # first load and a quick one.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Modest hardening. No CSP here on purpose — the app loads fonts and talks
    # to five Lambda origins, so a policy written blind would break it. Add one
    # deliberately once the origins are settled.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 5m;
}
